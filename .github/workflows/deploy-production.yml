name: Deploy ingest log UI (production)

on:
  push:
    branches: [production]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID_PROD }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_PROD }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID_PROD }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL_PROD }}
        run: |
          npm ci
          npm run build

      - name: Upload to Cloud Storage
        run: |
          gcloud storage rsync --recursive dist "gs://${{ secrets.GCS_BUCKET_PROD }}"

      - name: Done
        run: |
          echo "Deployed to gs://${{ secrets.GCS_BUCKET_PROD }}/"
          echo "https://storage.googleapis.com/${{ secrets.GCS_BUCKET_PROD }}/index.html"
